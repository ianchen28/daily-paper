[project]
name = "daily-paper"
version = "0.1.0"
description = "自动获取 daily papers 列表并用大模型分析并推送结果"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "feedparser>=6.0.10",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
daily-paper = "daily_paper.main:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
