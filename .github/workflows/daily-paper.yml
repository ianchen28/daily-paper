name: Daily Paper

on:
  schedule:
    # 每天 UTC 时间 8:00 运行（北京时间 16:00）
    - cron: '0 8 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run daily paper
        timeout-minutes: 60  # 设置超时时间为 60 分钟
        env:
          # Secrets（敏感信息）
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Variables（环境变量）
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          INCLUDE_REASONING: ${{ vars.INCLUDE_REASONING }}
          SMTP_SERVER: ${{ vars.SMTP_SERVER }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_TIMEOUT: ${{ vars.SMTP_TIMEOUT }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
          EMAIL_RECEIVER: ${{ vars.EMAIL_RECEIVER }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          MAX_PAPERS: ${{ vars.MAX_PAPERS }}
        run: |
          echo "🚀 开始运行 Daily Paper..."
          echo "📊 配置信息:"
          echo "  MODEL_NAME: ${{ vars.MODEL_NAME }}"
          echo "  MAX_PAPERS: ${{ vars.MAX_PAPERS }}"
          echo "  KEYWORDS: ${{ vars.KEYWORDS }}"
          echo ""
          uv run python main.py
